name: Setup Rust from rust-toolchain.toml
description: Installs the rustc channel pinned in rust-toolchain.toml.

inputs:
  components:
    description: Comma-separated rustup components (e.g. rustfmt, clippy)
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Read toolchain channel
      id: toolchain
      shell: bash
      run: |
        set -euo pipefail
        channel="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml | head -n1)"
        if [ -z "$channel" ]; then
          echo "::error::No channel in rust-toolchain.toml"
          exit 1
        fi
        echo "channel=$channel" >> "$GITHUB_OUTPUT"

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ steps.toolchain.outputs.channel }}
        components: ${{ inputs.components }}